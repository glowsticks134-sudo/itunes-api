name: Deploy App Catalog PWA

on:
  push:
    branches:
      - feature/ios-app-search
    paths:
      - "web-app/**"
      - ".github/workflows/deploy-app-catalog.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify App Catalog files
        run: |
          test -f web-app/index.html
          test -f web-app/manifest.webmanifest
          test -f web-app/service-worker.js
          echo "App Catalog files found."

      - name: Upload App Catalog site
        uses: actions/upload-pages-artifact@v3
        with:
          path: web-app

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
