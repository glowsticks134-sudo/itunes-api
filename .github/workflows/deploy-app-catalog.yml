name: Deploy App Catalog PWA

on:
  push:
    branches:
      - feature/ios-app-search
    paths:
      - "web-app/**"
      - ".github/workflows/deploy-app-catalog.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy App Catalog
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 1. Check out repository
        uses: actions/checkout@v4

      - name: 2. Show branch and files
        run: |
          echo "Branch: $GITHUB_REF_NAME"
          echo "Workspace: $GITHUB_WORKSPACE"
          echo "Files in web-app:"
          ls -la web-app

      - name: 3. Verify required PWA files
        run: |
          test -s web-app/index.html
          test -s web-app/manifest.webmanifest
          test -s web-app/service-worker.js
          test -s web-app/icon.svg
          echo "All required App Catalog files are present."

      - name: 4. Upload website artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web-app

      - name: 5. Deploy website to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
