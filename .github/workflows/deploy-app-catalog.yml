name: Deploy App Catalog PWA

on:
  push:
    branches:
      - feature/ios-app-search
    paths:
      - "web-app/**"
      - ".github/workflows/deploy-app-catalog.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload App Catalog site
        uses: actions/upload-pages-artifact@v3
        with:
          path: web-app
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4